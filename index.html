<script type="text/babel-src" id="appCode">
const { useState, useEffect, useMemo, useRef } = React;
const CFG = window.PF_CONFIG;
const SUPA_OK = !!(window.supabase && window.supabase.createClient);
const CONFIGURED = CFG.SUPABASE_URL.startsWith("http") && CFG.SUPABASE_ANON_KEY.length > 20;
let db = null;
try { if (CONFIGURED && SUPA_OK) db = window.supabase.createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY); } catch(e){}

const TARGETS = ["Claude Code","Cursor","ChatGPT","Replit","Lovable","n8n","Other"];
const SEED = [
  { title:"Proof before completion", category:"Completion proof", priority:10, body:"Do not claim a task is complete. List the exact files you created or changed, state the test or build result (or why it could not run), and call out anything still unresolved." },
  { title:"No invented requirements", category:"Prompting", priority:10, body:"If a requirement is missing or ambiguous, ask one focused question or state the assumption explicitly. Never silently fill a gap with a guess." },
  { title:"Phase large work", category:"Architecture", priority:9, body:"For anything beyond a single small change, work in phases. After each phase, stop and summarize what changed before continuing." },
  { title:"Respect existing code", category:"Coding", priority:9, body:"Inspect the existing project before writing. Do not rename, move, reformat, or rewrite unrelated code or files." },
  { title:"Make assumptions visible", category:"Prompting", priority:8, body:"List every assumption you made at the top of your response so it can be corrected before it costs anything." },
];
const EMPTY = { idea:"", target:"Claude Code", context:"", deliverable:"", mustHaves:"", exclusions:"", acceptance:"", outputFormat:"", example:"", phased:true, proof:true, assumptions:true };

const lines = (s)=> String(s||"").split("\n").map(x=>x.trim()).filter(Boolean);
const bullets = (s)=> lines(s).map(x=>`- ${x}`).join("\n");

function assemble(f, rules){
  const active = rules.filter(r=>r.active).sort((a,b)=>b.priority-a.priority);
  const role = (f.target==="Claude Code"||f.target==="Cursor")
    ? "You are a careful senior engineer working directly in my codebase."
    : "You are a careful senior collaborator on the task below.";
  const o=[]; o.push("# Build task"); o.push(role+"\n");
  o.push("## What I'm building"); o.push((f.idea||"(no description given)")+"\n");
  o.push("## Current context"); o.push((f.context.trim()||"Greenfield — no existing code or systems.")+"\n");
  if(f.deliverable.trim()){ o.push("## Deliverable"); o.push(f.deliverable.trim()+"\n"); }
  if(f.mustHaves.trim()){ o.push("## Must include"); o.push(bullets(f.mustHaves)+"\n"); }
  if(f.exclusions.trim()){ o.push("## Out of scope — do NOT build these"); o.push(bullets(f.exclusions)+"\n"); }
  if(f.acceptance.trim()){ o.push("## How I'll know it's done (acceptance criteria)"); o.push(bullets(f.acceptance)+"\n"); }
  if(f.outputFormat.trim()){ o.push("## What to hand back"); o.push(f.outputFormat.trim()+"\n"); }
  if(f.example.trim()){ o.push("## Example of what I want"); o.push("```\n"+f.example.trim()+"\n```\n"); }
  if(active.length){ o.push("## Standing rules"); o.push(active.map((r,i)=>`${i+1}. ${r.body}`).join("\n")+"\n"); }
  const c=[];
  if(f.phased && f.target==="Claude Code") c.push("Work in phases. After each phase, stop and tell me what changed before continuing.");
  if(f.assumptions) c.push("List every assumption you made at the top of your reply.");
  if(f.proof) c.push("When you finish, name the exact files you changed, give the test/run result, and flag anything unresolved. Don't claim it's done without that.");
  if(c.length){ o.push("## Before you say it's done"); o.push(c.map(x=>`- ${x}`).join("\n")); }
  return o.join("\n").trim();
}
function readiness(f){
  const px=/pixel|design|ui|figma|mockup|screenshot/i.test(f.idea+f.deliverable+f.mustHaves);
  const ref=/figma|screenshot|attach|reference|http|\.png|\.jpg|like (the )?app/i.test(f.context+f.example);
  return [
    {ok:!!f.idea.trim(), label:"Idea is described"},
    {ok:!!f.deliverable.trim(), label:"Deliverable is named"},
    {ok:!!f.acceptance.trim(), label:"Acceptance criteria given", weight:"This is the one that matters most."},
    {ok:!!f.exclusions.trim(), label:"Out-of-scope is listed", weight:"Biggest defense against scope creep."},
    {ok:!!f.outputFormat.trim(), label:"Output format chosen"},
    ...(px?[{ok:ref, label:"Design reference provided", weight:"You mentioned design/UI — without a reference, 'pixel-perfect' is undefined."}]:[]),
  ];
}
function parseBulk(text, cat, prio){
  if(!text.trim()) return [];
  let chunks = text.split(/\n\s*\n/).map(s=>s.trim()).filter(Boolean);
  if(chunks.length<=1) chunks = text.split(/\n/).map(s=>s.trim()).filter(Boolean);
  const strip = s=> s.replace(/^\s*(?:[-*•▪]|\d+[.)])\s+/,"").trim();
  return chunks.map(c=>{ const body=strip(c); const head=body.split(/[:.\n]/)[0].trim();
    return { title: head.length>56?head.slice(0,53)+"…":head, body, category: (cat.trim()||"Imported"), priority: Number(prio)||7 }; });
}

/* ---------------------------- Login ---------------------------- */
function Login(){
  const [email,setEmail]=useState(""); const [pw,setPw]=useState("");
  const [err,setErr]=useState(""); const [busy,setBusy]=useState(false);
  const go=async()=>{ setErr(""); setBusy(true);
    const { error } = await db.auth.signInWithPassword({ email, password: pw });
    if(error) setErr(error.message); setBusy(false);
  };
  return (
    <div className="pf"><div className="center"><div className="box">
      <h1>Prompt<b>Forge</b></h1><div className="tag">shared team brain · sign in</div>
      <label><div className="lab">Email</div>
        <input value={email} onChange={e=>setEmail(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} /></label>
      <label><div className="lab">Password</div>
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} onKeyDown={e=>e.key==="Enter"&&go()} /></label>
      <button className="btn" style={{width:"100%"}} onClick={go} disabled={busy||!email||!pw}>{busy?"…":"Sign in"}</button>
      {err && <div className="err">{err}</div>}
      <div className="who" style={{marginTop:16}}>Accounts are created by your admin in Supabase. No public sign-up.</div>
    </div></div></div>
  );
}

/* ---------------------------- Main ---------------------------- */
function App(){
  const [tab,setTab]=useState("build");
  const [f,setF]=useState(EMPTY);
  const [rules,setRules]=useState([]);
  const [runs,setRuns]=useState([]);
  const [prompt,setPrompt]=useState(""); const [copied,setCopied]=useState(false);
  const [brainMode,setBrainMode]=useState("one");
  const [draft,setDraft]=useState({title:"",category:"",body:"",priority:7});
  const [bulk,setBulk]=useState({text:"",cat:"",prio:7}); const [drafts,setDrafts]=useState([]);

  const fetchRules=async()=>{ const {data}=await db.from("rules").select("*").order("priority",{ascending:false}).order("created_at",{ascending:false}); setRules(data||[]); };
  const fetchRuns =async()=>{ const {data}=await db.from("runs").select("*").order("created_at",{ascending:false}).limit(100); setRuns(data||[]); };

  useEffect(()=>{ fetchRules(); fetchRuns();
    const ch = db.channel("pf")
      .on("postgres_changes",{event:"*",schema:"public",table:"rules"}, fetchRules)
      .on("postgres_changes",{event:"*",schema:"public",table:"runs"}, fetchRuns)
      .subscribe();
    return ()=>{ db.removeChannel(ch); };
  },[]);

  const set=(k)=>(e)=>setF({...f,[k]:e.target.value});
  const tog=(k)=>()=>setF({...f,[k]:!f[k]});
  const ready=useMemo(()=>readiness(f),[f]);
  const activeCount=rules.filter(r=>r.active).length;

  const build=()=>{ setPrompt(assemble(f,rules)); setCopied(false); };
  const copy=()=>{ navigator.clipboard?.writeText(prompt).then(()=>{ setCopied(true); setTimeout(()=>setCopied(false),1600); }); };

  const seed=async()=>{ await db.from("rules").insert(SEED); };
  const addRule=async()=>{ if(!draft.title.trim()||!draft.body.trim()) return;
    await db.from("rules").insert([{title:draft.title.trim(),category:draft.category.trim()||"General",body:draft.body.trim(),priority:Number(draft.priority)||7,active:true}]);
    setDraft({title:"",category:"",body:"",priority:7}); };
  const toggleRule=async(r)=>{ await db.from("rules").update({active:!r.active}).eq("id",r.id); };
  const delRule=async(r)=>{ await db.from("rules").delete().eq("id",r.id); };

  const splitBulk=()=> setDrafts(parseBulk(bulk.text,bulk.cat,bulk.prio));
  const updDraft=(i,k,v)=> setDrafts(drafts.map((d,j)=> j===i?{...d,[k]:v}:d));
  const rmDraft=(i)=> setDrafts(drafts.filter((_,j)=>j!==i));
  const addAll=async()=>{ const valid=drafts.filter(d=>d.title.trim()&&d.body.trim()); if(!valid.length) return;
    await db.from("rules").insert(valid.map(d=>({title:d.title.trim(),category:d.category.trim()||"Imported",body:d.body.trim(),priority:Number(d.priority)||7,active:true})));
    setDrafts([]); setBulk({...bulk,text:""}); };

  const saveRun=async()=>{ await db.from("runs").insert([{idea:f.idea||"(untitled)",target:f.target,prompt,result:"untested"}]); setTab("history"); };
  const mark=async(r,result)=>{ await db.from("runs").update({result}).eq("id",r.id); };

  const signOut=()=> db.auth.signOut();
  const email = (window.__pf_email)||"";

  return (
    <div className="pf"><div className="wrap">
      <div className="top">
        <div>
          <div className="brand">Prompt<b>Forge</b></div>
          <div className="sub">shared team brain</div>
          <div className="who">{email} · <a onClick={signOut}>sign out</a></div>
        </div>
        <div className="stat">brain: <b>{activeCount}</b> active rules &nbsp;·&nbsp; runs: <b>{runs.length}</b>
          <span className="live"><span className="pulse"></span>live</span></div>
      </div>

      <div className="tabs">
        {[["build","Build"],["brain","Brain"],["history","History"]].map(([k,l])=>(
          <button key={k} className={"tab"+(tab===k?" act":"")} onClick={()=>setTab(k)}>{l}</button>))}
      </div>

      {tab==="build" && (
        <div className="grid">
          <div className="card">
            <h3>1 · The request</h3>
            <div className="row" style={{marginBottom:14}}>
              <button className="btn ghost" onClick={()=>{ setF(EMPTY); setPrompt(""); }}>Clear</button>
            </div>
            <label className="f"><div className="lab">The messy idea — what do you want built?</div>
              <textarea value={f.idea} onChange={set("idea")} placeholder="Say it plainly, like you'd say it to a teammate." /></label>
            <label className="f"><div className="lab">Which tool gets the final prompt?</div>
              <select value={f.target} onChange={set("target")}>{TARGETS.map(t=><option key={t}>{t}</option>)}</select></label>
            <label className="f"><div className="lab">Current context <span className="hint">— existing code, stack, where files go</span></div>
              <textarea value={f.context} onChange={set("context")} /></label>
            <label className="f"><div className="lab">Deliverable <span className="hint">— the one thing that exists when done</span></div>
              <textarea value={f.deliverable} onChange={set("deliverable")} /></label>
            <label className="f"><div className="lab">Must include <span className="hint">— one per line</span></div>
              <textarea value={f.mustHaves} onChange={set("mustHaves")} /></label>
            <label className="f"><div className="lab">Do NOT build <span className="hint">— one per line · your scope fence</span></div>
              <textarea value={f.exclusions} onChange={set("exclusions")} /></label>
            <label className="f"><div className="lab">How you'll know it's done <span className="hint">— concrete · one per line</span></div>
              <textarea value={f.acceptance} onChange={set("acceptance")} placeholder="e.g. Running `x` produces `y`" /></label>
            <label className="f"><div className="lab">What to hand back</div>
              <textarea value={f.outputFormat} onChange={set("outputFormat")} /></label>
            <label className="f"><div className="lab">Example of what you want <span className="hint">— paste a sample output shape</span></div>
              <textarea value={f.example} onChange={set("example")} /></label>
            <div className="lab" style={{marginBottom:8}}>Closing rules to enforce</div>
            <div className="toggles" style={{marginBottom:18}}>
              <label className="tg"><input type="checkbox" checked={f.proof} onChange={tog("proof")} /><span>Require proof before "done"<small>names files changed, gives run result</small></span></label>
              <label className="tg"><input type="checkbox" checked={f.assumptions} onChange={tog("assumptions")} /><span>List assumptions up front</span></label>
              <label className="tg"><input type="checkbox" checked={f.phased} onChange={tog("phased")} /><span>Phase the work (Claude Code)</span></label>
            </div>
            <button className="btn amber" style={{width:"100%"}} onClick={build} disabled={!f.idea.trim()}>Assemble prompt →</button>
          </div>
          <div>
            <div className="card" style={{marginBottom:20}}>
              <h3>2 · Readiness</h3>
              <ul className="ready">{ready.map((c,i)=>(
                <li key={i} className={c.ok?"":"miss"}>
                  <span className={"dot "+(c.ok?"y":"n")}>{c.ok?"✓":"–"}</span>
                  <span><span className="ttl">{c.label}</span>{!c.ok&&c.weight&&<span className="w">{c.weight}</span>}</span>
                </li>))}</ul>
            </div>
            <h3 style={{fontSize:13,letterSpacing:".08em",textTransform:"uppercase",color:"var(--amber)",fontWeight:500,margin:"0 0 12px"}}>3 · The forged prompt</h3>
            {prompt ? (
              <div className="out">
                <div className="out-head"><span className="t">ready to paste into {f.target}</span>
                  <div className="row"><button className="btn ghost" onClick={copy}>{copied?"copied ✓":"copy"}</button>
                    <button className="btn" onClick={saveRun}>save run</button></div></div>
                <pre>{prompt}</pre>
              </div>
            ) : (<div className="card empty"><div className="big">Nothing forged yet.</div>Fill the request and hit Assemble.</div>)}
          </div>
        </div>
      )}

      {tab==="brain" && (
        <div className="grid">
          <div>
            <div className="note"><b>This Brain is shared.</b> Anything you add here appears for the whole team within a second — and anything a teammate adds appears for you. Keep each rule atomic: a single instruction Claude can act on.</div>
            {rules.length===0 && <div className="card empty"><div className="big">The Brain is empty.</div>
              <button className="btn" style={{marginTop:10}} onClick={seed}>Seed 5 starter rules</button> &nbsp; or bulk-paste your own →</div>}
            {rules.map(r=>(
              <div key={r.id} className={"rule"+(r.active?"":" off")}>
                <div className="rule-top">
                  <label className="sw"><input type="checkbox" checked={r.active} onChange={()=>toggleRule(r)} /><span className="tk"/></label>
                  <span className="rt">{r.title}</span><span className="pill">{r.category}</span>
                  <span className="prio">p{r.priority}</span>
                  <button className="del" title="delete" onClick={()=>delRule(r)}>×</button>
                </div><p>{r.body}</p>
              </div>))}
          </div>
          <div className="card">
            <div className="seg">
              <button className={"sgb"+(brainMode==="one"?" on":"")} onClick={()=>setBrainMode("one")}>Add one</button>
              <button className={"sgb"+(brainMode==="bulk"?" on":"")} onClick={()=>setBrainMode("bulk")}>Bulk paste</button>
            </div>
            {brainMode==="one" && <div className="add">
              <label className="f" style={{margin:0}}><div className="lab">Title</div>
                <input value={draft.title} onChange={e=>setDraft({...draft,title:e.target.value})} /></label>
              <div className="row">
                <label className="f" style={{margin:0,flex:2}}><div className="lab">Category</div>
                  <input value={draft.category} onChange={e=>setDraft({...draft,category:e.target.value})} /></label>
                <label className="f" style={{margin:0,flex:1}}><div className="lab">Priority 1–10</div>
                  <input type="number" min="1" max="10" value={draft.priority} onChange={e=>setDraft({...draft,priority:e.target.value})} /></label>
              </div>
              <label className="f" style={{margin:0}}><div className="lab">The rule</div>
                <textarea value={draft.body} onChange={e=>setDraft({...draft,body:e.target.value})} style={{minHeight:90}} /></label>
              <button className="btn" onClick={addRule} disabled={!draft.title.trim()||!draft.body.trim()}>Add to shared brain</button>
            </div>}
            {brainMode==="bulk" && <div className="add">
              <div className="row">
                <label className="f" style={{margin:0,flex:2}}><div className="lab">Default category</div>
                  <input value={bulk.cat} onChange={e=>setBulk({...bulk,cat:e.target.value})} placeholder="e.g. Universal" /></label>
                <label className="f" style={{margin:0,flex:1}}><div className="lab">Default priority</div>
                  <input type="number" min="1" max="10" value={bulk.prio} onChange={e=>setBulk({...bulk,prio:e.target.value})} /></label>
              </div>
              <label className="f" style={{margin:0}}><div className="lab">Paste your knowledge <span className="hint">— split into reviewable blocks</span></div>
                <textarea value={bulk.text} onChange={e=>setBulk({...bulk,text:e.target.value})} style={{minHeight:160}} placeholder={"One rule per line, or separate longer rules with a blank line."} /></label>
              <button className="btn" onClick={splitBulk} disabled={!bulk.text.trim()}>Split into blocks →</button>
              {drafts.length>0 && <>
                <div className="dh"><span className="c">{drafts.length} block(s) ready</span>
                  <div className="row"><button className="btn ghost" onClick={()=>setDrafts([])}>discard</button>
                    <button className="btn amber" onClick={addAll}>add all to brain</button></div></div>
                {drafts.map((d,i)=>(
                  <div key={i} className="draft">
                    <label className="f" style={{margin:0}}><div className="lab">Title</div>
                      <input value={d.title} onChange={e=>updDraft(i,"title",e.target.value)} /></label>
                    <label className="f" style={{margin:"8px 0 0"}}><div className="lab">Rule</div>
                      <textarea value={d.body} onChange={e=>updDraft(i,"body",e.target.value)} style={{minHeight:60}} /></label>
                    <div className="dr-row">
                      <label className="f" style={{margin:0,flex:2}}><div className="lab">Category</div>
                        <input value={d.category} onChange={e=>updDraft(i,"category",e.target.value)} /></label>
                      <label className="f" style={{margin:0,flex:1}}><div className="lab">Priority</div>
                        <input type="number" min="1" max="10" value={d.priority} onChange={e=>updDraft(i,"priority",e.target.value)} /></label>
                      <button className="x" onClick={()=>rmDraft(i)}>remove</button>
                    </div>
                  </div>))}
              </>}
            </div>}
          </div>
        </div>
      )}

      {tab==="history" && (
        <div>
          {runs.length===0 ? (<div className="card empty"><div className="big">No runs saved yet.</div>Assemble a prompt, use it, then mark what happened. This history is shared across the team.</div>)
          : runs.map(run=>(
            <div key={run.id} className="run">
              <div className="run-top"><span className="pill">{run.target}</span>
                <span className="when">{new Date(run.created_at).toLocaleString()}</span></div>
              <div className="idea">{run.idea}</div>
              <div className="marks">{[["worked","Worked"],["edits","Needed edits"],["failed","Failed"],["untested","Untested"]].map(([k,l])=>(
                <button key={k} className={"mark "+k+(run.result===k?" on":"")} onClick={()=>mark(run,k)}>{l}</button>))}</div>
              <details><summary>view prompt</summary><pre>{run.prompt}</pre></details>
            </div>))}
        </div>
      )}
    </div></div>
  );
}

/* ---------------------------- Gate ---------------------------- */
class EB extends React.Component{
  constructor(p){ super(p); this.state={err:null}; }
  static getDerivedStateFromError(e){ return {err:e}; }
  render(){ if(this.state.err) return (<div className="pf"><div className="center"><div className="box"><h1>Something broke</h1><pre style={{whiteSpace:"pre-wrap",color:"var(--bad)",fontSize:12,marginTop:10}}>{String((this.state.err&&this.state.err.message)||this.state.err)}</pre></div></div></div>); return this.props.children; } }

function Root(){
  const [session,setSession]=useState(undefined);
  useEffect(()=>{
    if(!CONFIGURED || !db){ setSession(null); return; }
    db.auth.getSession().then(({data})=>{ window.__pf_email=data.session?.user?.email; setSession(data.session); });
    const { data:sub } = db.auth.onAuthStateChange((_e,s)=>{ window.__pf_email=s?.user?.email; setSession(s); });
    return ()=> sub.subscription.unsubscribe();
  },[]);
  if(!CONFIGURED) return <Setup/>;
  if(!SUPA_OK) return (<div className="pf"><div className="center"><div className="box"><h1>Library didn't load</h1><div className="setup">The Supabase script was blocked or failed to load — almost always an ad-blocker / privacy extension, or being offline. Open this file in a normal browser window with extensions off, while online, then reload.</div></div></div></div>);
  if(session===undefined) return <div className="pf"><div className="center"><div className="who">loading…</div></div></div>;
  if(!session) return <Login/>;
  return <App/>;
}

try {
  const _root = ReactDOM.createRoot(document.getElementById("root"));
  _root.render(<EB><Root/></EB>);
  document.getElementById("root").setAttribute("data-mounted","1");
} catch(err) {
  document.getElementById("root").setAttribute("data-mounted","1");
  document.getElementById("root").innerHTML = '<pre style="color:#C96A5A;background:#0E1419;margin:0;min-height:100vh;font-family:monospace;font-size:13px;line-height:1.6;padding:28px;white-space:pre-wrap">Real error:\n\n'+((err&&(err.stack||err.message))||err)+'</pre>';
}
</script>

<script>
/* Compile the JSX ourselves with explicit classic runtime (no importSource).
   This sidesteps Babel's auto-transform defaults that were erroring out. */
(function(){
  function show(html){ var r=document.getElementById('root'); if(r){ r.innerHTML='<pre style="color:#C96A5A;background:#0E1419;margin:0;min-height:100vh;font-family:monospace;font-size:13px;line-height:1.6;padding:28px;white-space:pre-wrap">'+html+'</pre>'; } }
  if(!window.Babel){ show('Babel did not load — CDN blocked or offline. Serve over http with extensions off, while online.'); return; }
  if(!window.React || !window.ReactDOM){ show('React did not load — CDN blocked or offline.'); return; }
  var code = document.getElementById('appCode').textContent;
  var out;
  try { out = Babel.transform(code, { presets: [['react', { runtime: 'classic' }]] }).code; }
  catch(err){ show('Compile error:\n\n'+((err&&(err.stack||err.message))||err)); return; }
  var s = document.createElement('script'); s.textContent = out; document.body.appendChild(s);
})();
</script>
</body>
